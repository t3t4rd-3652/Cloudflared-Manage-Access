name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Vérifier que le tag correspond à la version
        id: meta
        shell: bash
        run: |
          version=$(uv run python -c "import cma; print(cma.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          # Un tag de préversion (v2.0.0-rc.1) publie la même version, marquée « préversion ».
          test "${tag%%-*}" = "${version}" || { echo "Tag ${GITHUB_REF_NAME} ≠ version ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${tag}" != "${version}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Audit des dépendances (vulnérabilités connues)
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-release.txt
          uvx pip-audit --disable-pip --require-hashes -r requirements-release.txt
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build de l'application (onedir)
        run: uv run python packaging/build.py --stage app
      - name: Signature des exécutables (si un certificat est configuré)
        if: ${{ env.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: ./packaging/sign.ps1 dist/CloudflaredManageAccess/*.exe
      - name: Zip portable et installeur
        run: uv run python packaging/build.py --stage package
      - name: Signature de l'installeur (si un certificat est configuré)
        if: ${{ env.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: ./packaging/sign.ps1 dist/*-setup.exe
      - name: Inventaire des composants (SBOM CycloneDX)
        shell: bash
        run: >
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements-release.txt
          --output-format JSON
          --output-file "dist/CloudflaredManageAccess-${{ steps.meta.outputs.version }}-sbom.cdx.json"
      - name: Empreintes SHA-256
        run: uv run python packaging/build.py --stage sums
      - name: Manifestes winget
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          installer="CloudflaredManageAccess-${version}-setup.exe"
          uv run python packaging/winget.py --installer "dist/${installer}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${installer}"
          (cd dist/winget && 7z a -tzip "../winget-manifests-${version}.zip" manifests > /dev/null)
      - name: Notes de version tirées du CHANGELOG
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          {
            echo "## Téléchargements"
            echo
            echo "| Fichier | Usage |"
            echo "| --- | --- |"
            echo "| \`CloudflaredManageAccess-${version}-setup.exe\` | Installeur (sans droits administrateur), mise à jour en un clic |"
            echo "| \`CloudflaredManageAccess-${version}-portable.zip\` | Version portable : décompressez et lancez ; tout reste dans \`data/\`, secrets compris (coffre chiffré) |"
            echo "| \`SHA256SUMS.txt\` | Empreintes à vérifier avec \`Get-FileHash\` ou \`sha256sum -c\` |"
            echo
            awk -v h="## [$version]" 'index($0, h) == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/CloudflaredManageAccess-*-portable.zip
            dist/CloudflaredManageAccess-*-setup.exe
            dist/CloudflaredManageAccess-*-sbom.cdx.json
            dist/winget-manifests-*.zip
            dist/SHA256SUMS.txt

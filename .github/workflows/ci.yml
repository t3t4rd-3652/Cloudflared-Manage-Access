name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Bibliothèques système de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1
      - run: uv sync --locked
      - name: Tests et couverture
        run: >
          uv run pytest -m "not real_cloudflared and not network"
          -W ignore::pytest.PytestUnraisableExceptionWarning
          --cov=cma --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Couverture du cœur (90 % minimum)
        run: uv run coverage report --include="src/cma/core/*" --fail-under=90

  real-cloudflared:
    name: Vrai cloudflared (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Bibliothèques système de Qt (Linux, chargées par le plugin pytest-qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1
      - run: uv sync --locked
      - name: Dernier cloudflared officiel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflared"
          base=https://github.com/cloudflare/cloudflared/releases/latest/download
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL "$base/cloudflared-windows-amd64.exe" -o "$RUNNER_TEMP/cloudflared/cloudflared.exe"
          else
            curl -fsSL "$base/cloudflared-linux-amd64" -o "$RUNNER_TEMP/cloudflared/cloudflared"
            chmod +x "$RUNNER_TEMP/cloudflared/cloudflared"
          fi
          echo "$RUNNER_TEMP/cloudflared" >> "$GITHUB_PATH"
      - run: cloudflared --version
      - name: Tests contre le vrai binaire
        # Sans les tests d'interface : ce job n'installe pas les bibliothèques système de Qt.
        run: >
          uv run pytest tests/unit tests/integration -m real_cloudflared
          -W ignore::pytest.PytestUnraisableExceptionWarning -rs

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Vulnérabilités connues (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit --disable-pip --require-hashes -r requirements-audit.txt

  server-scripts:
    name: Scripts serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S style server/ports-report server/install.sh tests/server/run-in-docker.sh tests/server/*.bats
      - name: bats (Debian/mawk, Ubuntu, Alpine/busybox)
        run: bash tests/server/run-in-docker.sh

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Bibliothèques système de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1
      - run: uv sync --locked
      - name: Tests et couverture
        # Délai par test : `timeout` dans pyproject.toml. PYTHONFAULTHANDLER écrit la pile Python même en cas de
        # plantage natif (SIGABRT de Qt) ; le journal complet est publié en artefact quand le job échoue, car les
        # journaux des jobs ne sont lisibles qu'aux administrateurs.
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run pytest -v -m "not real_cloudflared and not network"
          -W ignore::pytest.PytestUnraisableExceptionWarning
          --cov=cma --cov-report=term --cov-report=xml --cov-fail-under=80
          2>&1 | tee pytest-${{ matrix.os }}.log
      - name: Journal des tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.log
          retention-days: 14
      - name: Couverture du cœur (90 % minimum)
        run: uv run coverage report --include="src/cma/core/*" --fail-under=90

  real-cloudflared:
    name: Vrai cloudflared (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Bibliothèques système de Qt (Linux, chargées par le plugin pytest-qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1
      - run: uv sync --locked
      - name: Dernier cloudflared officiel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflared"
          base=https://github.com/cloudflare/cloudflared/releases/latest/download
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL "$base/cloudflared-windows-amd64.exe" -o "$RUNNER_TEMP/cloudflared/cloudflared.exe"
          else
            curl -fsSL "$base/cloudflared-linux-amd64" -o "$RUNNER_TEMP/cloudflared/cloudflared"
            chmod +x "$RUNNER_TEMP/cloudflared/cloudflared"
          fi
          echo "$RUNNER_TEMP/cloudflared" >> "$GITHUB_PATH"
      - run: cloudflared --version
      - name: Tests contre le vrai binaire
        # Sans les tests d'interface, qui sont couverts par le job « Tests ».
        run: >
          uv run pytest tests/unit tests/integration -m real_cloudflared
          -W ignore::pytest.PytestUnraisableExceptionWarning -rs

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Vulnérabilités connues (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit --disable-pip --require-hashes -r requirements-audit.txt

  server-scripts:
    name: Scripts serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x -S style server/ports-report server/install.sh tests/server/run-in-docker.sh tests/server/*.bats
      - name: bats (Debian/mawk, Ubuntu, Alpine/busybox)
        run: bash tests/server/run-in-docker.sh

  startup:
    name: Temps de démarrage
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fenêtre prête en moins de 6 s (médiane de 5 essais)
        run: uv run python scripts/startup_benchmark.py --runs 5 --limit-ms 6000

  captures:
    name: Captures (100, 125, 150 %)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Captures à trois échelles d'affichage
        shell: bash
        run: |
          for scale in 1 1.25 1.5; do
            QT_SCALE_FACTOR=$scale uv run python scripts/capture_screenshots.py "captures/x$scale"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: captures
          path: captures
          retention-days: 30
      - name: Captures du dernier main réussi
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name captures --dir reference
      - name: Comparaison (informative)
        if: hashFiles('reference/**/*.png') != ''
        run: uv run python scripts/compare_captures.py reference captures --diff captures-diff
      - uses: actions/upload-artifact@v7
        if: hashFiles('captures-diff/**/*.png') != ''
        with:
          name: captures-diff
          path: captures-diff
          retention-days: 30
